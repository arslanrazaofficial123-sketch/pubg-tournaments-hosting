services:
  - type: web
    name: pubg-tournaments-backend
    runtime: node
    rootDir: backend
    buildCommand: curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared && chmod +x cloudflared && npm install && npm run build
    startCommand: bash scripts/start-with-db-tunnel.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FILES_BASE_URL
        sync: false
      - key: FILES_TOKEN
        sync: false
      - key: CF_ACCESS_CLIENT_ID
        sync: false
      - key: CF_ACCESS_CLIENT_SECRET
        sync: false
      - key: PORT
        value: 5000